[project]
name = "memoryweave"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.136.1",
    "huggingface-hub>=1.14.0",
    "langchain>=1.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.0",
    "langsmith>=0.8.3",
    "networkx>=3.6.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
