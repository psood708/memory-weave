steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/memoryweave-api:$COMMIT_SHA
      - -f
      - Dockerfile.api
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/memoryweave-api:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - memoryweave-api
      - --image=gcr.io/$PROJECT_ID/memoryweave-api:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --memory=1Gi
      - --cpu=1
      - --set-env-vars=APP_ENV=production,LLM_PROVIDER=groq
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,QDRANT_URL=QDRANT_URL:latest,QDRANT_API_KEY=QDRANT_API_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest,AUTH_SECRET=AUTH_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest

images:
  - gcr.io/$PROJECT_ID/memoryweave-api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
